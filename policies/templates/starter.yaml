# Tool-agnostic starter policy (what every new app gets).
rules:
  - id: allow-read-up-to-confidential
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: source
      - type: sensitivity_at_most
        level: confidential
    effect: allow
    escalateOnly: false
  - id: review-read-restricted
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: source
      - type: sensitivity_at_least
        level: restricted
    effect: review
    escalateOnly: false
  - id: allow-send-to-user-destination
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: sink
      - type: destination_in_mandate
        value: true
      - type: tool_risk_at_most
        level: medium
      - type: sensitivity_at_most
        level: internal
    effect: allow
    escalateOnly: false
  - id: review-send-confidential
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: sink
      - type: destination_in_mandate
        value: true
      - type: sensitivity_at_least
        level: confidential
    effect: review
    escalateOnly: false
  - id: review-send-high-risk
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: sink
      - type: destination_in_mandate
        value: true
      - type: tool_risk_at_least
        level: high
    effect: review
    escalateOnly: false
  - id: block-send-restricted
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: sink
      - type: sensitivity_at_least
        level: restricted
    effect: block
    escalateOnly: false
  - id: review-send-after-injection-signal
    description: ""
    tools:
      - "*"
    conditions:
      - type: tool_kind
        kind: sink
      - type: signal_present
        signal: injection_suspected
    effect: review
    escalateOnly: true
approvalTtlSeconds: 900
