name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Real PostgreSQL 16 tests
        run: npm run test:pg
      - name: Policy templates (policy as code)
        run: for p in starter strict-approvals internal-only; do npm run -s policy -- test policies/templates/$p.yaml policies/tests/$p.cases.yaml; done
      - name: Deterministic security benchmark
        run: npm run bench
      - name: Production build
        run: npx next build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (desktop + mobile, security regression)
        run: npm run test:e2e
