[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-sdk"
version = "0.1.0"
description = "Guard AI agent tool calls with an AgentGuard server (ALLOW / REVIEW / BLOCK, decision tokens). Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ed25519 = ["cryptography>=42"]

[tool.setuptools]
packages = ["agentguard"]
