# Callwrit as a SIDECAR next to your own agent app.
#
#   docker compose -f docker-compose.sidecar.yml up -d --build
#
# Your agent services join the `callwrit` network and call http://callwrit:3000/v1
# with an API key. Create the app and keys in the UI (http://127.0.0.1:3001, sign in as
# an approver, "Apps & API keys").
#
# Add to YOUR compose file:
#   services:
#     my-agent:
#       environment:
#         CALLWRIT_URL: http://callwrit:3000
#         CALLWRIT_API_KEY: ${CALLWRIT_API_KEY}
#       networks: [default, callwrit]
#   networks:
#     callwrit:
#       external: true
#       name: callwrit
#
# Security notes
#  - /v1 is reachable only on the private `callwrit` network; nothing is published
#    except the approval UI, bound to 127.0.0.1.
#  - The UI uses DEMO identities (no IdP). Keep it on localhost / behind your SSO proxy.
#  - Set AUTH_SECRET once and keep it: decision-token keys are derived from it.
services:
  callwrit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callwrit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callwrit-sidecar-local}
      POSTGRES_DB: callwrit
    volumes:
      - callwrit-sidecar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callwrit -d callwrit"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  callwrit:
    build: .
    depends_on:
      callwrit-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://callwrit:${POSTGRES_PASSWORD:-callwrit-sidecar-local}@callwrit-db:5432/callwrit
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (>=16 chars) and keep it stable}
      CALLWRIT_DEMO_AUTH: ${CALLWRIT_DEMO_AUTH:-1}
    ports:
      - "127.0.0.1:${CALLWRIT_UI_PORT:-3001}:3000"
    networks: [internal, callwrit]

networks:
  internal: {}
  callwrit:
    name: callwrit

volumes:
  callwrit-sidecar-pg:
